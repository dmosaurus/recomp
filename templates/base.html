<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Devin — Recomp Tracker</title>
<link rel="manifest" href="/static/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>window.QUICK_FOODS = {{ quick_foods | tojson }};</script>
</head>
<body>
<div class="toast" id="toast"></div>

<nav class="nav">
  <div class="nav-logo">D<span>·</span>RECOMP</div>
  <div class="nav-tabs">
    <a href="/"            class="nav-tab {% if request.path == '/' %}active{% endif %}">Dashboard</a>
    <a href="/program"     class="nav-tab {% if request.path == '/program' %}active{% endif %}">Program</a>
    <a href="/log"         class="nav-tab {% if request.path == '/log' %}active{% endif %}">Log Workout</a>
    <a href="/history"     class="nav-tab {% if request.path == '/history' %}active{% endif %}">History</a>
    <a href="/progress"    class="nav-tab {% if request.path == '/progress' %}active{% endif %}">Progress</a>
    <a href="/nutrition"   class="nav-tab {% if request.path.startswith('/nutrition') %}active{% endif %}">Nutrition</a>
    <a href="/body-scan"   class="nav-tab {% if request.path == '/body-scan' %}active{% endif %}">Body Scan</a>
  </div>
</nav>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}

<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
